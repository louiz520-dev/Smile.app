<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>司機端 - 倉儲掃碼與棧板數量登載</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 15px; background-color: #121212; color: #E0E0E0;
      display: flex; flex-direction: column; align-items: center;
    }
    .card {
      background: #1E1E1E; width: 100%; max-width: 480px; padding: 20px;
      border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      margin-bottom: 20px; box-sizing: border-box; border: 1px solid #333;
    }
    .gold-text { color: #D4AF37; }
    #status-msg { color: #AAAAAA; font-size: 14px; margin-top: 8px; word-wrap: break-word; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; display: none; margin-top: 15px; border: 2px solid #D4AF37; }
    input[type="text"], select {
      width: 100%; padding: 12px; margin: 6px 0 12px 0; box-sizing: border-box;
      background-color: #2C2C2C; border: 1px solid #444; border-radius: 8px; color: #FFFFFF; font-size: 15px;
    }
    input[type="text"]:focus, select:focus { outline: none; border-color: #D4AF37; }
    
    .pallet-item {
      background: #2A2A2A; padding: 12px; border-radius: 10px; margin-bottom: 10px;
      border: 1px solid #3D3D3D;
    }
    .pallet-row { display: flex; align-items: center; justify-content: space-between; }
    .pallet-label { display: flex; align-items: center; cursor: pointer; font-size: 15px; font-weight: 500; }
    .pallet-label input[type="checkbox"] { margin-right: 10px; transform: scale(1.3); accent-color: #D4AF37; }
    
    .qty-counter { display: none; align-items: center; gap: 5px; }
    .qty-btn {
      background: #383838; color: #D4AF37; border: 1px solid #555;
      width: 32px; height: 32px; border-radius: 6px; font-size: 18px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .qty-input {
      width: 50px !important; text-align: center; margin: 0 !important; padding: 6px !important;
      font-weight: bold; font-size: 16px; color: #D4AF37 !important;
    }
    .sub-option-box {
      display: none; background: #141414; padding: 10px; border-radius: 8px;
      border-left: 3px solid #D4AF37; margin-top: 10px;
    }
    .sub-option-box label { font-size: 13px; color: #D4AF37; display: block; margin-bottom: 4px; }

    .status-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-label {
      display: flex; align-items: center; background: #2A2A2A; padding: 10px 14px;
      border-radius: 8px; cursor: pointer; border: 1px solid #3D3D3D;
    }
    .radio-label input { margin-right: 10px; transform: scale(1.2); accent-color: #D4AF37; }

    hr { margin: 20px 0; border: 0; border-top: 1px solid #333; }
    .btn {
      width: 100%; padding: 16px; font-size: 16px; font-weight: bold; border: none;
      border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-bottom: 10px;
    }
    .btn-gold { background: linear-gradient(135deg, #D4AF37 0%, #F1D279 100%); color: #121212; }
    .btn-outline { background: transparent; color: #D4AF37; border: 1px solid #D4AF37; }
    .btn-danger { background-color: #333; color: #FF6B6B; border: 1px solid #555; }
    #print-area { display: none; background: #FFF; color: #000; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; }
    #qrcode-output { display: flex; justify-content: center; margin: 10px 0; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="driver-info">👤 司機：<span class="gold-text">載入中...</span></h2>
    <div id="status-msg">系統狀態：準備就緒</div>
  </div>

  <div class="card">
    <h3 class="gold-text">📷 條碼掃描 / 手動輸入</h3>
    <button id="btn-toggle-cam" class="btn btn-gold" onclick="toggleCamera()">開啟相機掃描</button>
    <div id="reader"></div>

    <hr>

    <label for="barcode-input" style="color: #AAAAAA;">貨件編號 / 條碼：</label>
    <input type="text" id="barcode-input" placeholder="請掃描或輸入條碼">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; margin-bottom: 10px;">
      <h3 class="gold-text" style="margin:0;">📦 棧板明細與數量</h3>
      <span id="total-pallet-count" style="font-size: 14px; color: #D4AF37; font-weight: bold;">總計：0 板</span>
    </div>

    <div class="pallet-container">
      <!-- 1. 中華紅板 -->
      <div class="pallet-item">
        <div class="pallet-row">
          <label class="pallet-label">
            <input type="checkbox" class="p-check" data-id="red" onchange="togglePalletItem('red')">
            1. 中華紅板
          </label>
          <div class="qty-counter" id="qty-box-red">
            <button class="qty-btn" onclick="changeQty('input-qty-red', -1)">-</button>
            <input type="number" id="input-qty-red" class="qty-input" value="1" min="1" onchange="updateTotalPallets()">
            <button class="qty-btn" onclick="changeQty('input-qty-red', 1)">+</button>
          </div>
        </div>
        <div id="sub-red" class="sub-option-box">
          <label>請選擇規格：</label>
          <select id="sel-red">
            <option value="單面">1. 單面</option>
            <option value="雙面">2. 雙面</option>
          </select>
        </div>
      </div>

      <!-- 2. PX 板 -->
      <div class="pallet-item">
        <div class="pallet-row">
          <label class="pallet-label">
            <input type="checkbox" class="p-check" data-id="px" onchange="togglePalletItem('px')">
            2. PX 板
          </label>
          <div class="qty-counter" id="qty-box-px">
            <button class="qty-btn" onclick="changeQty('input-qty-px', -1)">-</button>
            <input type="number" id="input-qty-px" class="qty-input" value="1" min="1" onchange="updateTotalPallets()">
            <button class="qty-btn" onclick="changeQty('input-qty-px', 1)">+</button>
          </div>
        </div>
        <div id="sub-px" class="sub-option-box">
          <label>請選擇用途：</label>
          <select id="sel-px" onchange="toggleCustomInput('sel-px', 'input-px-custom')">
            <option value="全聯用">1. 全聯用</option>
            <option value="CUSTOM">2. 外倉用 (自行輸入)</option>
          </select>
          <input type="text" id="input-px-custom" placeholder="請輸入外倉名稱..." style="display:none; margin-top:6px;">
        </div>
      </div>

      <!-- 3. 中華綠板 -->
      <div class="pallet-item">
        <div class="pallet-row">
          <label class="pallet-label">
            <input type="checkbox" class="p-check" data-id="green" onchange="togglePalletItem('green')">
            3. 中華綠板
          </label>
          <div class="qty-counter" id="qty-box-green">
            <button class="qty-btn" onclick="changeQty('input-qty-green', -1)">-</button>
            <input type="number" id="input-qty-green" class="qty-input" value="1" min="1" onchange="updateTotalPallets()">
            <button class="qty-btn" onclick="changeQty('input-qty-green', 1)">+</button>
          </div>
        </div>
        <div id="sub-green" class="sub-option-box">
          <label>請選擇規格：</label>
          <select id="sel-green">
            <option value="單面">1. 單面</option>
            <option value="雙面">2. 雙面</option>
          </select>
        </div>
      </div>

      <!-- 4. 百事 籃板 -->
      <div class="pallet-item">
        <div class="pallet-row">
          <label class="pallet-label">
            <input type="checkbox" class="p-check" data-id="pepsi" onchange="togglePalletItem('pepsi')">
            4. 百事 籃板
          </label>
          <div class="qty-counter" id="qty-box-pepsi">
            <button class="qty-btn" onclick="changeQty('input-qty-pepsi', -1)">-</button>
            <input type="number" id="input-qty-pepsi" class="qty-input" value="1" min="1" onchange="updateTotalPallets()">
            <button class="qty-btn" onclick="changeQty('input-qty-pepsi', 1)">+</button>
          </div>
        </div>
      </div>

      <!-- 5. 路凱 橘板 -->
      <div class="pallet-item">
        <div class="pallet-row">
          <label class="pallet-label">
            <input type="checkbox" class="p-check" data-id="loscam-orange" onchange="togglePalletItem('loscam-orange')">
            5. 路凱 橘板
          </label>
          <div class="qty-counter" id="qty-box-loscam-orange">
            <button class="qty-btn" onclick="changeQty('input-qty-loscam-orange', -1)">-</button>
            <input type="number" id="input-qty-loscam-orange" class="qty-input" value="1" min="1" onchange="updateTotalPallets()">
            <button class="qty-btn" onclick="changeQty('input-qty-loscam-orange', 1)">+</button>
          </div>
        </div>
      </div>

      <!-- 6. 路凱 綠板 -->
      <div class="pallet-item">
        <div class="pallet-row">
          <label class="pallet-label">
            <input type="checkbox" class="p-check" data-id="loscam-green" onchange="togglePalletItem('loscam-green')">
            6. 路凱 綠板
          </label>
          <div class="qty-counter" id="qty-box-loscam-green">
            <button class="qty-btn" onclick="changeQty('input-qty-loscam-green', -1)">-</button>
            <input type="number" id="input-qty-loscam-green" class="qty-input" value="1" min="1" onchange="updateTotalPallets()">
            <button class="qty-btn" onclick="changeQty('input-qty-loscam-green', 1)">+</button>
          </div>
        </div>
      </div>

      <!-- 7. 塑膠 雜板 -->
      <div class="pallet-item">
        <div class="pallet-row">
          <label class="pallet-label">
            <input type="checkbox" class="p-check" data-id="plastic-other" onchange="togglePalletItem('plastic-other')">
            7. 塑膠 雜板
          </label>
          <div class="qty-counter" id="qty-box-plastic-other">
            <button class="qty-btn" onclick="changeQty('input-qty-plastic-other', -1)">-</button>
            <input type="number" id="input-qty-plastic-other" class="qty-input" value="1" min="1" onchange="updateTotalPallets()">
            <button class="qty-btn" onclick="changeQty('input-qty-plastic-other', 1)">+</button>
          </div>
        </div>
      </div>

      <!-- 8. 木頭 雜板 -->
      <div class="pallet-item">
        <div class="pallet-row">
          <label class="pallet-label">
            <input type="checkbox" class="p-check" data-id="wood-other" onchange="togglePalletItem('wood-other')">
            8. 木頭 雜板
          </label>
          <div class="qty-counter" id="qty-box-wood-other">
            <button class="qty-btn" onclick="changeQty('input-qty-wood-other', -1)">-</button>
            <input type="number" id="input-qty-wood-other" class="qty-input" value="1" min="1" onchange="updateTotalPallets()">
            <button class="qty-btn" onclick="changeQty('input-qty-wood-other', 1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <h3 class="gold-text" style="margin-top: 20px; margin-bottom: 10px;">🏷️ 貨物狀態</h3>
    <div class="status-group">
      <label class="radio-label">
        <input type="radio" name="main_status" value="卸貨/入倉" checked onclick="handleStatusChange('none')">
        1. 卸貨/入倉
      </label>
      <label class="radio-label">
        <input type="radio" name="main_status" value="提貨/出倉" onclick="handleStatusChange('none')">
        2. 提貨/出倉
      </label>
      <label class="radio-label">
        <input type="radio" name="main_status" value="轉倉" onclick="handleStatusChange('sub-transfer')">
        3. 轉倉
      </label>
      <div id="sub-transfer" class="sub-option-box">
        <label>轉倉目的地：</label>
        <select id="sel-transfer" onchange="toggleCustomInput('sel-transfer', 'input-transfer-custom')">
          <option value="台南新市_百事">1. 台南新市_百事</option>
          <option value="台南新市_聯合">2. 台南新市_聯合</option>
          <option value="台中梧棲_聯合">3. 台中梧棲_聯合</option>
          <option value="CUSTOM">4. 外倉轉入 (自行輸入)</option>
        </select>
        <input type="text" id="input-transfer-custom" placeholder="請輸入外倉名稱..." style="display:none; margin-top:5px;">
      </div>

      <label class="radio-label">
        <input type="radio" name="main_status" value="家樂福" onclick="handleStatusChange('sub-carrefour')">
        4. 家樂福
      </label>
      <div id="sub-carrefour" class="sub-option-box">
        <select id="sel-carrefour">
          <option value="入倉(先馳微笑)">1. 入倉(先馳微笑)</option>
          <option value="出倉(家樂福)">2. 出倉(家樂福)</option>
        </select>
      </div>

      <label class="radio-label">
        <input type="radio" name="main_status" value="全聯岡山" onclick="handleStatusChange('sub-pxmart')">
        5. 全聯岡山
      </label>
      <div id="sub-pxmart" class="sub-option-box">
        <select id="sel-pxmart">
          <option value="立庫入倉">1. 立庫入倉</option>
          <option value="立庫出倉">2. 立庫出倉</option>
          <option value="寄庫入倉">3. 寄庫入倉</option>
          <option value="寄庫出倉">4. 寄庫出倉</option>
          <option value="越庫入倉">5. 越庫入倉</option>
          <option value="越庫出倉">6. 越庫出倉</option>
        </select>
      </div>

      <label class="radio-label">
        <input type="radio" name="main_status" value="捷盟_新市" onclick="handleStatusChange('sub-jm-xinshi')">
        6. 捷盟_新市
      </label>
      <div id="sub-jm-xinshi" class="sub-option-box">
        <select id="sel-jm-xinshi">
          <option value="捷盟_新市入倉">1. 捷盟_新市入倉</option>
          <option value="捷盟_新市出倉">2. 捷盟_新市出倉</option>
        </select>
      </div>

      <label class="radio-label">
        <input type="radio" name="main_status" value="捷盟_仁武" onclick="handleStatusChange('sub-jm-renwu')">
        7. 捷盟_仁武
      </label>
      <div id="sub-jm-renwu" class="sub-option-box">
        <select id="sel-jm-renwu">
          <option value="捷盟_仁武入倉">1. 捷盟_仁武入倉</option>
          <option value="捷盟_仁武出倉">2. 捷盟_仁武出倉</option>
        </select>
      </div>

      <label class="radio-label">
        <input type="radio" name="main_status" value="全台_岡山" onclick="handleStatusChange('sub-quantai')">
        8. 全台_岡山
      </label>
      <div id="sub-quantai" class="sub-option-box">
        <select id="sel-quantai">
          <option value="全台_岡山入倉">1. 全台_岡山入倉</option>
          <option value="全台岡山出倉">2. 全台岡山出倉</option>
        </select>
      </div>

      <label class="radio-label">
        <input type="radio" name="main_status" value="經銷商" onclick="handleStatusChange('sub-dealer')">
        9. 經銷商
      </label>
      <div id="sub-dealer" class="sub-option-box">
        <input type="text" id="input-dealer-name" placeholder="請輸入經銷商名稱...">
        <select id="sel-dealer-type">
          <option value="入倉">1. 入倉</option>
          <option value="出倉">2. 出倉</option>
        </select>
      </div>
    </div>

    <button class="btn btn-gold" style="margin-top:15px;" onclick="submitData()">確認送出紀錄</button>
    <button class="btn btn-outline" onclick="generateQRLabel()">🖨️ 產生 QR 標籤貼紙</button>

    <div id="print-area">
      <h3 style="margin: 5px 0; font-size: 18px; color: #000;">倉儲貨物標籤</h3>
      <div id="qrcode-output"></div>
      <div id="lbl-barcode" style="font-weight: bold; font-size: 16px;"></div>
      <div id="lbl-pallet" style="font-size: 13px; color: #121212; font-weight: bold; margin-top: 4px;"></div>
      <div id="lbl-status" style="font-size: 13px; margin-top: 2px;"></div>
      <div id="lbl-driver" style="font-size: 12px; color: #555; margin-top: 2px;"></div>
      <button class="btn btn-gold no-print" style="margin-top: 15px;" onclick="window.print()">🖨️ 立即列印此標籤</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const driverName = urlParams.get('user') || urlParams.get('driver') || "測試司機";
    document.getElementById('driver-info').innerHTML = `👤 司機：<span class="gold-text">${driverName}</span>`;

    let html5QrcodeScanner = null;
    let isScanning = false;

    function togglePalletItem(id) {
      const cb = document.querySelector(`.p-check[data-id="${id}"]`);
      const qtyBox = document.getElementById(`qty-box-${id}`);
      const subBox = document.getElementById(`sub-${id}`);

      if (cb.checked) {
        if (qtyBox) qtyBox.style.display = 'flex';
        if (subBox) subBox.style.display = 'block';
      } else {
        if (qtyBox) qtyBox.style.display = 'none';
        if (subBox) subBox.style.display = 'none';
      }
      updateTotalPallets();
    }

    function changeQty(inputId, delta) {
      const input = document.getElementById(inputId);
      let val = parseInt(input.value) || 1;
      val += delta;
      if (val < 1) val = 1;
      input.value = val;
      updateTotalPallets();
    }

    function updateTotalPallets() {
      let total = 0;
      const checkedBoxes = document.querySelectorAll('.p-check:checked');
      checkedBoxes.forEach(cb => {
        const id = cb.getAttribute('data-id');
        const qty = parseInt(document.getElementById(`input-qty-${id}`).value) || 1;
        total += qty;
      });
      document.getElementById('total-pallet-count').innerText = `總計：${total} 板`;
    }

    function toggleCustomInput(selectId, inputId) {
      const selVal = document.getElementById(selectId).value;
      document.getElementById(inputId).style.display = (selVal === 'CUSTOM') ? 'block' : 'none';
    }

    function handleStatusChange(activeSubId) {
      document.querySelectorAll('.sub-option-box').forEach(box => {
        if (!box.id.startsWith('sub-red') && !box.id.startsWith('sub-px') && !box.id.startsWith('sub-green')) {
          box.style.display = 'none';
        }
      });
      if (activeSubId !== 'none') {
        const activeBox = document.getElementById(activeSubId);
        if (activeBox) activeBox.style.display = 'block';
      }
    }

    function getSelectedPalletsData() {
      const pallets = [];
      const checkedBoxes = document.querySelectorAll('.p-check:checked');

      checkedBoxes.forEach(cb => {
        const id = cb.getAttribute('data-id');
        const count = parseInt(document.getElementById(`input-qty-${id}`).value) || 1;
        let name = '';

        if (id === 'red') {
          const spec = document.getElementById('sel-red').value;
          name = `中華紅板 (${spec})`;
        } else if (id === 'px') {
          const spec = document.getElementById('sel-px').value;
          if (spec === 'CUSTOM') {
            const custom = document.getElementById('input-px-custom').value.trim() || '未指定外倉';
            name = `PX板 (外倉_${custom})`;
          } else {
            name = `PX板 (${spec})`;
          }
        } else if (id === 'green') {
          const spec = document.getElementById('sel-green').value;
          name = `中華綠板 (${spec})`;
        } else if (id === 'pepsi') name = '百事 籃板';
        else if (id === 'loscam-orange') name = '路凱 橘板';
        else if (id === 'loscam-green') name = '路凱 綠板';
        else if (id === 'plastic-other') name = '塑膠 雜板';
        else if (id === 'wood-other') name = '木頭 雜板';

        pallets.push({ name, count });
      });

      return pallets;
    }

    function getFinalStatus() {
      const selectedRadio = document.querySelector('input[name="main_status"]:checked');
      if (!selectedRadio) return '卸貨/入倉';
      const mainVal = selectedRadio.value;

      if (mainVal === '轉倉') {
        const subVal = document.getElementById('sel-transfer').value;
        if (subVal === 'CUSTOM') {
          const customTxt = document.getElementById('input-transfer-custom').value.trim();
          return `轉倉 - 外倉轉入_${customTxt || '未填寫'}`;
        }
        return `轉倉 - ${subVal}`;
      } else if (mainVal === '家樂福') {
        return `家樂福 - ${document.getElementById('sel-carrefour').value}`;
      } else if (mainVal === '全聯岡山') {
        return `全聯岡山 - ${document.getElementById('sel-pxmart').value}`;
      } else if (mainVal === '捷盟_新市') {
        return `捷盟_新市 - ${document.getElementById('sel-jm-xinshi').value}`;
      } else if (mainVal === '捷盟_仁武') {
        return `捷盟_仁武 - ${document.getElementById('sel-jm-renwu').value}`;
      } else if (mainVal === '全台_岡山') {
        return `全台_岡山 - ${document.getElementById('sel-quantai').value}`;
      } else if (mainVal === '經銷商') {
        const dealerName = document.getElementById('input-dealer-name').value.trim() || '未指定';
        const type = document.getElementById('sel-dealer-type').value;
        return `經銷商 - ${dealerName}${type}`;
      }
      return mainVal;
    }

    function generateQRLabel() {
      const barcode = document.getElementById('barcode-input').value.trim();
      const pallets = getSelectedPalletsData();

      if (!barcode) { alert("請先輸入或掃描條碼！"); return; }
      if (pallets.length === 0) { alert("請至少勾選一種棧板種類並設定數量！"); return; }

      const palletText = pallets.map(p => `${p.name} x${p.count}`).join(', ');
      const finalStatus = getFinalStatus();
      const qrContainer = document.getElementById('qrcode-output');
      qrContainer.innerHTML = "";

      new QRCode(qrContainer, { text: barcode, width: 140, height: 140 });

      document.getElementById('lbl-barcode').innerText = `單號: ${barcode}`;
      document.getElementById('lbl-pallet').innerText = `棧板明細: ${palletText}`;
      document.getElementById('lbl-status').innerText = `狀態: ${finalStatus}`;
      document.getElementById('lbl-driver').innerText = `登載人: ${driverName} | ${new Date().toLocaleDateString()}`;
      document.getElementById('print-area').style.display = "block";
    }

    function toggleCamera() {
      const readerElem = document.getElementById('reader');
      const btn = document.getElementById('btn-toggle-cam');
      const statusMsg = document.getElementById('status-msg');

      if (!isScanning) {
        readerElem.style.display = "block";
        btn.innerText = "關閉相機";
        btn.className = "btn btn-danger";
        statusMsg.innerText = "⏳ 正在啟動相機...";
        
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 250, height: 150 } },
          (decodedText) => {
            document.getElementById('barcode-input').value = decodedText;
            statusMsg.innerHTML = `✅ 成功讀取：<span class="gold-text">${decodedText}</span>`;
            if (navigator.vibrate) navigator.vibrate(100);
            toggleCamera();
          },
          () => {}
        ).then(() => statusMsg.innerText = "📷 相機運作中，請對準條碼")
         .catch(err => { alert("無法存取相機！"); forceCloseCamera(); });
        isScanning = true;
      } else {
        forceCloseCamera();
      }
    }

    function forceCloseCamera() {
      const readerElem = document.getElementById('reader');
      const btn = document.getElementById('btn-toggle-cam');
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => { html5QrcodeScanner.clear(); resetCamUI(); }).catch(() => resetCamUI());
      } else { resetCamUI(); }
      
      function resetCamUI() {
        readerElem.style.display = "none";
        btn.innerText = "開啟相機掃描";
        btn.className = "btn btn-gold";
        isScanning = false;
      }
    }

    async function submitData() {
      const barcode = document.getElementById('barcode-input').value.trim();
      const statusMsg = document.getElementById('status-msg');
      const finalStatus = getFinalStatus();
      const pallets = getSelectedPalletsData();

      if (!barcode) { alert("請輸入或掃描條碼！"); return; }
      if (pallets.length === 0) { alert("請至少勾選一種棧板種類！"); return; }

      statusMsg.innerHTML = "⏳ 資料寫入中...";

      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            driver: driverName,
            barcode: barcode,
            status: finalStatus,
            pallets: pallets
          })
        });

        const result = await response.json();
        if (response.ok) {
          const summaryStr = pallets.map(p => `${p.name}x${p.count}`).join(', ');
          statusMsg.innerHTML = `🎉 <span class="gold-text">${barcode}</span> 送出成功！[${summaryStr}]`;
          if (navigator.vibrate) navigator.vibrate(100);
        } else {
          statusMsg.innerText = `❌ 上傳失敗：${result.error || '資料庫錯誤'}`;
        }
      } catch (error) {
        statusMsg.innerText = "❌ 伺服器連線異常";
      }
    }
  </script>
</body>
</html>
