<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>倉儲棧板管理與動態庫存儀表板</title>
  
  <!-- 全套 Favicon 與 App 圖示設定 -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  
  <!-- Web App Manifest & iOS PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="倉儲儀表板">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#121212">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1E1E1E;
      --accent-gold: #D4AF37;
      --text-main: #FFFFFF;
      --text-muted: #AAAAAA;
      --border-color: #333333;
      --success-color: #4CAF50;
      --danger-color: #FF5252;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    h1, h2 {
      color: var(--accent-gold);
      margin-top: 0;
      font-size: 16px;
      margin-bottom: 10px;
    }

    /* 上方功能列 */
    .top-bar {
      background: var(--card-bg);
      border: 1px solid var(--accent-gold);
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 10px;
    }

    .driver-generator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2A2A2A;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #444;
      flex-wrap: wrap;
    }
    .driver-generator input {
      background: var(--bg-dark);
      border: 1px solid #555;
      color: #FFF;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      width: 110px;
      outline: none;
    }
    .driver-generator input:focus {
      border-color: var(--accent-gold);
    }

    /* 按鈕樣式 */
    .btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .btn-gold {
      background: linear-gradient(135deg, #D4AF37 0%, #F1D279 100%);
      color: #121212;
    }
    .btn-gold:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }
    .btn-outline:hover {
      background: rgba(212, 175, 55, 0.1);
    }
    .btn-danger {
      background: rgba(255, 82, 82, 0.2);
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
    }
    .btn-danger:hover {
      background: rgba(255, 82, 82, 0.4);
    }

    /* 卡片與圖表區塊 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 10px;
      box-sizing: border-box;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      margin-bottom: 15px;
    }
    .chart-card {
      height: 280px;
      display: flex;
      flex-direction: column;
      margin-bottom: 0;
    }
    .chart-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* 表格樣式 */
    .table-responsive {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px 10px;
      text-align: left;
    }
    th {
      background-color: #2A2A2A;
      color: var(--accent-gold);
      font-weight: 600;
      white-space: nowrap;
    }
    tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
    tr:hover { background-color: rgba(212, 175, 55, 0.05); }

    /* 狀態與棧板標籤 */
    .badge {
      background: rgba(212, 175, 55, 0.2);
      color: #F1D279;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      margin-right: 4px;
      margin-bottom: 2px;
      display: inline-block;
    }
    .status-badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .status-in { background: rgba(76, 175, 80, 0.2); color: var(--success-color); border: 1px solid var(--success-color); }
    .status-out { background: rgba(255, 82, 82, 0.2); color: var(--danger-color); border: 1px solid var(--danger-color); }

    /* 彈出視窗 Modal 樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--accent-gold);
      padding: 20px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      background: var(--bg-dark);
      border: 1px solid #444;
      color: #FFF;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <div class="top-bar">
    <div class="top-left">
      <h1 style="margin:0; font-size: 18px;">🚚 倉儲管理儀表板</h1>
      <span id="user-role-badge" class="badge" style="display:none;">---</span>
      <a href="/scan.html" class="btn btn-gold" target="_blank">📱 前往司機端 ↗</a>
      <a href="/history.html" class="btn btn-outline" target="_blank">📜 查看過往紀錄 ↗</a>
      <span class="status-info" id="last-updated">更新時間：載入中...</span>
    </div>

    <div class="driver-generator">
      <span style="font-size: 13px; color: var(--text-muted);" id="current-user-display">使用者：---</span>
      <span style="font-size: 13px; color: var(--text-muted);">| 司機：</span>
      <input type="text" id="driver-input" placeholder="例如：王小明">
      <button class="btn btn-outline" onclick="openDriverPage()" style="padding: 5px 10px; font-size: 12px;">開啟</button>
      <button class="btn btn-gold" onclick="copyDriverLink()" style="padding: 5px 10px; font-size: 12px;">複製連結</button>
      <button class="btn btn-outline" onclick="fetchAnalytics()" style="padding: 5px 8px; font-size: 12px;" title="手動重新整理">🔄</button>
      <button class="btn btn-danger" onclick="logout()" style="padding: 5px 8px; font-size: 12px;">登出</button>
    </div>
  </div>

  <!-- 📊 圖表區塊 -->
  <div class="grid">
    <div class="card chart-card">
      <h2>📊 今日個別棧板進出數量總覽 (板)</h2>
      <div class="chart-container">
        <canvas id="dailyChart"></canvas>
      </div>
    </div>
    <div class="card chart-card">
      <h2>📦 倉庫目前動態棧板庫存比例</h2>
      <div class="chart-container">
        <canvas id="stockChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 📋 當日作業紀錄與數量明細表 -->
  <div class="card">
    <h2>📋 當日單次作業紀錄與數量明細</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th style="width: 100px;">時間</th>
            <th style="width: 120px;">司機</th>
            <th style="width: 160px;">條碼/單號</th>
            <th>棧板明細 (個別數量)</th>
            <th style="width: 100px;">貨物動態</th>
          </tr>
        </thead>
        <tbody id="today-table">
          <tr><td colspan="5" style="text-align:center; color: var(--text-muted);">資料載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 🔐 高階管理員專用：帳號與權限管理中心 -->
  <div class="card" id="admin-panel" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2>🔐 帳號與權限管理中心 (高階管理員專用)</h2>
      <button class="btn btn-gold" onclick="openCreateUserModal()">➕ 新增帳號</button>
    </div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>姓名</th>
            <th>帳號 (Username)</th>
            <th>角色權限</th>
            <th>狀態</th>
            <th>建立時間</th>
            <th style="width: 180px;">操作功能</th>
          </tr>
        </thead>
        <tbody id="users-table-body">
          <tr><td colspan="6" style="text-align:center; color: var(--text-muted);">帳號資料載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ➕ 新增帳號 Modal -->
  <div id="create-user-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2 style="margin-top:0;">新增使用者帳號</h2>
      <div class="form-group">
        <label>真實姓名</label>
        <input type="text" id="new-name" placeholder="例如：張大明">
      </div>
      <div class="form-group">
        <label>帳號 (Username)</label>
        <input type="text" id="new-username" placeholder="登入用帳號">
      </div>
      <div class="form-group">
        <label>預設密碼</label>
        <input type="password" id="new-password" placeholder="請設定初始密碼">
      </div>
      <div class="form-group">
        <label>權限角色</label>
        <select id="new-role">
          <option value="driver">司機 (driver)</option>
          <option value="warehouse_manager">倉管人員 (warehouse_manager)</option>
          <option value="admin">管理員 (admin)</option>
          <option value="super_admin">高階管理員 (super_admin)</option>
        </select>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px;">
        <button class="btn btn-outline" onclick="closeCreateUserModal()">取消</button>
        <button class="btn btn-gold" onclick="submitCreateUser()">建立帳號</button>
      </div>
    </div>
  </div>

  <script>
    let dailyChart = null;
    let stockChart = null;
    let isFetching = false;

    // 取得帶有 Authorization Header 的 API Request Helper
    function getAuthHeaders() {
      const token = localStorage.getItem('token');
      return {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      };
    }

    // HTML 安全轉義
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 1. 權限檢查與初始化 (使用 localStorage)
    function checkAuth() {
      const token = localStorage.getItem('token');
      const userRole = localStorage.getItem('userRole');
      const userName = localStorage.getItem('userName') || '使用者';

      // 前端基本 Token 與角色權限攔截
      if (!token || !['super_admin', 'admin', 'warehouse_manager'].includes(userRole)) {
        window.location.href = '/admin-login.html';
        return false;
      }

      // 顯示目前使用者
      document.getElementById('current-user-display').innerText = `使用者：${userName}`;

      // 角色 Badge 顯示與控制管理面板
      const badge = document.getElementById('user-role-badge');
      if (userRole === 'super_admin' || userRole === 'admin') {
        badge.innerText = userRole === 'super_admin' ? '👑 高階管理員' : '⚙️ 管理員';
        badge.style.display = 'inline-block';
        document.getElementById('admin-panel').style.display = 'block';
        fetchUsersList();
      } else if (userRole === 'warehouse_manager') {
        badge.innerText = '📦 倉管人員';
        badge.style.display = 'inline-block';
      }

      fetchAnalytics();
      setInterval(fetchAnalytics, 10000);
      return true;
    }

    // 登出邏輯
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userRole');
      localStorage.removeItem('userName');
      localStorage.removeItem('userId');
      window.location.href = '/admin-login.html';
    }

    // 司機連結產生
    function getDriverUrl() {
      const name = document.getElementById('driver-input').value.trim() || '司機';
      return `${window.location.origin}/scan.html?driver=${encodeURIComponent(name)}`;
    }

    function openDriverPage() { 
      window.open(getDriverUrl(), '_blank'); 
    }

    function copyDriverLink() {
      const url = getDriverUrl();
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url)
          .then(() => alert(`✅ 已複製司機專屬連結：\n${url}`))
          .catch(() => prompt("請複製下方連結：", url));
      } else {
        prompt("請複製下方連結：", url);
      }
    }

    // 2. 抓取與渲染數據 (帶 JWT Token)
    async function fetchAnalytics() {
      if (isFetching) return;
      isFetching = true;

      try {
        const res = await fetch('/api/analytics', {
          headers: getAuthHeaders()
        });

        // 若 Token 失效或過期
        if (res.status === 401 || res.status === 403) {
          alert('登入已過期或權限不足，請重新登入');
          logout();
          return;
        }

        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();

        document.getElementById('last-updated').innerText = `最後更新：${new Date().toLocaleTimeString()}`;

        renderTable(data.todayRecords || []);
        renderDailyChart(data.dailyInMap || {}, data.dailyOutMap || {});
        renderStockChart(data.stockMap || {});

      } catch (err) {
        console.error("分析資料載入失敗:", err);
        document.getElementById('last-updated').innerText = `更新失敗 (${new Date().toLocaleTimeString()})`;
      } finally {
        isFetching = false;
      }
    }

    // 渲染紀錄表格
    function renderTable(records) {
      const tbody = document.getElementById('today-table');
      tbody.innerHTML = '';

      if (!records || records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">今日尚無作業紀錄</td></tr>';
        return;
      }

      const fragment = document.createDocumentFragment();

      records.forEach(r => {
        const tr = document.createElement('tr');
        const timeStr = r.created_at ? new Date(r.created_at).toLocaleTimeString() : '--:--:--';
        const pallets = Array.isArray(r.pallets) ? r.pallets : [];
        
        let palletsHtml = '無棧板資訊';
        if (pallets.length > 0) {
          palletsHtml = pallets.map(p => {
            if (typeof p === 'object' && p !== null && p.name) {
              return `<span class="badge">${escapeHtml(p.name)} x${escapeHtml(p.count)}</span>`;
            }
            return `<span class="badge">${escapeHtml(p)}</span>`;
          }).join(' ');
        }

        const statusText = escapeHtml(r.status || '未知');
        let statusClass = 'status-badge';
        if (statusText.includes('進') || statusText.includes('入')) statusClass += ' status-in';
        else if (statusText.includes('出')) statusClass += ' status-out';

        tr.innerHTML = `
          <td>${escapeHtml(timeStr)}</td>
          <td><strong>${escapeHtml(r.driver || '未填寫')}</strong></td>
          <td><code>${escapeHtml(r.barcode || '-')}</code></td>
          <td>${palletsHtml}</td>
          <td><span class="${statusClass}">${statusText}</span></td>
        `;

        fragment.appendChild(tr);
      });

      tbody.appendChild(fragment);
    }

    // 進出長條圖
    function renderDailyChart(dailyInMap, dailyOutMap) {
      const palletKeys = Array.from(new Set([...Object.keys(dailyInMap), ...Object.keys(dailyOutMap)]));
      const inCounts = palletKeys.map(k => dailyInMap[k] || 0);
      const outCounts = palletKeys.map(k => dailyOutMap[k] || 0);

      const ctx = document.getElementById('dailyChart').getContext('2d');
      if (dailyChart) dailyChart.destroy();

      dailyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: palletKeys.length ? palletKeys : ['無資料'],
          datasets: [
            { label: '進倉 (+)', data: inCounts.length ? inCounts : [0], backgroundColor: '#4CAF50', borderRadius: 4 },
            { label: '出倉 (-)', data: outCounts.length ? outCounts : [0], backgroundColor: '#FF5252', borderRadius: 4 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#FFF', font: { size: 11 } }, position: 'top' }
          },
          scales: {
            x: { ticks: { color: '#AAA', font: { size: 10 } }, grid: { color: '#222' } },
            y: { ticks: { color: '#AAA', font: { size: 10 } }, grid: { color: '#222' }, beginAtZero: true }
          }
        }
      });
    }

    // 庫存圓餅圖
    function renderStockChart(stockMap) {
      const stockKeys = Object.keys(stockMap);
      const stockValues = stockKeys.map(k => stockMap[k]);

      const ctx = document.getElementById('stockChart').getContext('2d');
      if (stockChart) stockChart.destroy();

      stockChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: stockKeys.length ? stockKeys : ['暫無庫存'],
          datasets: [{
            data: stockValues.length ? stockValues : [1],
            backgroundColor: ['#D4AF37', '#2196F3', '#4CAF50', '#FF9800', '#9C27B0', '#E91E63', '#00BCD4', '#795548'],
            borderWidth: 2,
            borderColor: '#1E1E1E'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { color: '#FFF', font: { size: 11 }, boxWidth: 12, padding: 10 }
            }
          }
        }
      });
    }

    // 3. 帳號管理功能 (帶 JWT Token)
    async function fetchUsersList() {
      try {
        const res = await fetch('/api/admin/users', {
          headers: getAuthHeaders()
        });
        if (!res.ok) return;
        const users = await res.json();
        
        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = '';

        const roleMap = {
          'driver': '司機',
          'warehouse_manager': '倉管人員',
          'admin': '管理員',
          'super_admin': '👑 高階管理員'
        };

        const currentUserId = localStorage.getItem('userId');

        users.forEach(u => {
          const tr = document.createElement('tr');
          const isSelf = currentUserId && String(currentUserId) === String(u.id);
          const statusText = u.is_active ? '🟢 正常' : '🔴 停用';

          tr.innerHTML = `
            <td><strong>${escapeHtml(u.name)}</strong></td>
            <td><code>${escapeHtml(u.username)}</code></td>
            <td><span class="badge">${roleMap[u.role] || escapeHtml(u.role)}</span></td>
            <td>${statusText}</td>
            <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '-'}</td>
            <td class="action-td"></td>
          `;

          const actionTd = tr.querySelector('.action-td');
          
          // 重置密碼按鈕
          const resetBtn = document.createElement('button');
          resetBtn.className = 'btn btn-outline';
          resetBtn.style.cssText = 'padding: 3px 8px; font-size: 11px; margin-right: 4px;';
          resetBtn.innerText = '🔑 重置密碼';
          resetBtn.onclick = () => resetPassword(u.id, u.name);
          actionTd.appendChild(resetBtn);

          // 啟用/停用按鈕
          if (!isSelf) {
            const toggleBtn = document.createElement('button');
            toggleBtn.className = u.is_active ? 'btn btn-danger' : 'btn btn-gold';
            toggleBtn.style.cssText = 'padding: 3px 8px; font-size: 11px;';
            toggleBtn.innerText = u.is_active ? '停用' : '啟用';
            toggleBtn.onclick = () => toggleUserStatus(u.id, !u.is_active);
            actionTd.appendChild(toggleBtn);
          } else {
            const selfSpan = document.createElement('span');
            selfSpan.style.cssText = 'font-size:11px; color:#888;';
            selfSpan.innerText = '(當前帳號)';
            actionTd.appendChild(selfSpan);
          }

          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('載入使用者列表失敗:', err);
      }
    }

    function openCreateUserModal() {
      document.getElementById('create-user-modal').style.display = 'flex';
    }

    function closeCreateUserModal() {
      document.getElementById('create-user-modal').style.display = 'none';
      document.getElementById('new-name').value = '';
      document.getElementById('new-username').value = '';
      document.getElementById('new-password').value = '';
    }

    async function submitCreateUser() {
      const name = document.getElementById('new-name').value.trim();
      const username = document.getElementById('new-username').value.trim();
      const password = document.getElementById('new-password').value;
      const role = document.getElementById('new-role').value;

      if (!name || !username || !password) {
        alert('請完整填寫所有欄位');
        return;
      }

      try {
        const res = await fetch('/api/admin/users', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ name, username, password, role })
        });
        const data = await res.json();
        if (res.ok) {
          alert('✅ 帳號建立成功！');
          closeCreateUserModal();
          fetchUsersList();
        } else {
          alert(`❌ 建立失敗：${data.error || '未知錯誤'}`);
        }
      } catch (err) {
        alert('❌ 系統錯誤，請稍後再試');
      }
    }

    async function resetPassword(userId, userName) {
      const newPassword = prompt(`請輸入 ${userName} 的新密碼：`);
      if (!newPassword) return;

      try {
        const res = await fetch(`/api/admin/users/${userId}/reset-password`, {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ newPassword })
        });
        if (res.ok) {
          alert(`✅ 已順利重置 ${userName} 的密碼！`);
        } else {
          const data = await res.json();
          alert(`❌ 重置失敗：${data.error || '未知錯誤'}`);
        }
      } catch (err) {
        alert('❌ 系統錯誤');
      }
    }

    async function toggleUserStatus(userId, isActive) {
      const actionText = isActive ? '啟用' : '停用';
      if (!confirm(`確定要${actionText}此帳號嗎？`)) return;

      try {
        const res = await fetch(`/api/admin/users/${userId}/status`, {
          method: 'PATCH',
          headers: getAuthHeaders(),
          body: JSON.stringify({ is_active: isActive })
        });
        if (res.ok) {
          fetchUsersList();
        } else {
          alert(`❌ 操作失敗`);
        }
      } catch (err) {
        alert('❌ 系統錯誤');
      }
    }

    // Service Worker 註冊
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW 註冊成功'))
          .catch(() => console.log('SW 註冊失敗或未建立 sw.js'));
      });
    }

    // 啟動初始化檢查
    checkAuth();
  </script>
</body>
</html>
