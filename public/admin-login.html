<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統管理後台 - 登入</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      background: #ffffff;
      border: 1px solid #e9ecef;
    }
    .brand-title {
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }
    .btn-admin {
      background-color: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
      font-weight: 600;
      padding: 0.6rem;
    }
    .btn-admin:hover {
      background-color: #334155;
      border-color: #334155;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <h3 class="brand-title">WMS 後台管理系統</h3>
      <p class="text-muted small">請輸入管理員帳號密碼以進行驗證</p>
    </div>

    <!-- 錯誤訊息提示框 -->
    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <form id="adminLoginForm">
      <div class="mb-3">
        <label for="username" class="form-label font-weight-bold">管理員帳號</label>
        <input type="text" class="form-control" id="username" placeholder="請輸入帳號" required autocomplete="username">
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">密碼</label>
        <input type="password" class="form-control" id="password" placeholder="請輸入密碼" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-admin w-100">
        <span id="btnText">登入後台</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
      </button>
    </form>

    <div class="text-center mt-4 border-top pt-3">
      <a href="/login.html" class="text-decoration-none text-secondary small">← 切換至司機端登入</a>
    </div>
  </div>

  <script>
    // 檢查若已有 Token，先驗證身份
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      const userRole = localStorage.getItem('userRole');

      if (token && ['super_admin', 'admin', 'warehouse_manager'].includes(userRole)) {
        window.location.href = '/index.html';
      }
    });

    const loginForm = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      // 清除錯誤提示
      alertBox.classList.add('d-none');
      alertBox.innerText = '';

      // 設定載入狀態
      submitBtn.disabled = true;
      btnText.innerText = '驗證中...';
      btnSpinner.classList.remove('d-none');

      try {
        const response = await fetch('/api/auth/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          // 儲存 Token 與 User 資訊
          localStorage.setItem('token', data.token);
          localStorage.setItem('userName', data.user.name);
          localStorage.setItem('userRole', data.user.role);

          // 跳轉至後台主頁
          window.location.href = data.redirectUrl || '/index.html';
        } else {
          showError(data.message || '登入失敗，請檢查帳號密碼。');
        }
      } catch (err) {
        console.error('登入請求錯誤:', err);
        showError('伺服器連線失敗，請稍後再試。');
      } finally {
        submitBtn.disabled = false;
        btnText.innerText = '登入後台';
        btnSpinner.classList.add('d-none');
      }
    });

    function showError(msg) {
      alertBox.innerText = msg;
      alertBox.classList.remove('d-none');
    }
  </script>
</body>
</html>
