<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷史所有作業紀錄 - Smile WMS</title>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1E1E1E;
      --accent-gold: #D4AF37;
      --text-main: #FFFFFF;
      --text-muted: #AAAAAA;
      --border-color: #333333;
      --success-color: #4CAF50;
      --danger-color: #FF5252;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      color: var(--accent-gold);
      margin: 0;
      font-size: 20px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }

    .btn-gold {
      background: linear-gradient(135deg, #D4AF37 0%, #F1D279 100%);
      color: #121212;
    }

    .btn-outline {
      background: transparent;
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }

    .btn-green {
      background: #2e7d32;
      color: #ffffff;
    }

    .btn-green:hover {
      background: #388e3c;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      margin-bottom: 15px;
      box-sizing: border-box;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background-color: #2A2A2A;
      color: var(--accent-gold);
    }

    tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
    tr:hover { background-color: rgba(212, 175, 55, 0.05); }

    .badge {
      background: rgba(212, 175, 55, 0.2);
      color: #F1D279;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .status-in { color: var(--success-color); font-weight: bold; }
    .status-out { color: var(--danger-color); font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div>
        <h1>📜 Google 試算表全歷史作業紀錄</h1>
        <small style="color: var(--text-muted);">顯示所有過往與最新的司機上傳紀錄</small>
      </div>
      <div class="btn-group">
        <!-- ⬇️ 匯出 CSV 按鈕 ⬇️ -->
        <button onclick="exportToCSV()" class="btn btn-green">📥 匯出 CSV 報表</button>
        <button onclick="fetchHistoryData()" class="btn btn-outline">🔄 重新整理</button>
        <button onclick="window.close()" class="btn btn-gold">✕ 關閉分頁</button>
      </div>
    </div>

    <input type="text" id="searchInput" class="search-input" placeholder="🔍 快速搜尋司機、條碼單號、狀態或棧板名稱..." onkeyup="filterData()">

    <div class="card">
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th style="width: 50px;">#</th>
              <th>時間</th>
              <th>司機</th>
              <th>單號 / 條碼</th>
              <th>動作狀態</th>
              <th>棧板明細</th>
            </tr>
          </thead>
          <tbody id="history-table">
            <tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 30px;">載入試算表歷史紀錄中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allRecords = [];
    let displayedRecords = []; // 紀錄目前畫面上過濾後的資料

    // 從 網址列(URL) 或 localStorage 取得 JWT Token
    function getToken() {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenFromUrl = urlParams.get('token');
      if (tokenFromUrl) {
        // 若網址列有 Token，順便存入 localStorage 供後續使用
        localStorage.setItem('token', tokenFromUrl);
        return tokenFromUrl;
      }
      return localStorage.getItem('token');
    }

    // 抓取過往歷史紀錄的函數
    async function fetchHistoryData() {
      const token = getToken();
      const tbody = document.getElementById('history-table');

      // 若完全沒有 Token，引導使用者重新登入
      if (!token) {
        alert('未偵測到登入憑證，請重新登入！');
        window.location.href = '/admin-login.html';
        return;
      }

      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 30px;">載入試算表歷史紀錄中...</td></tr>';

      try {
        // 先嘗試從 /api/history 抓取，若不符合可自動退回相容 /api/records
        let res = await fetch('/api/history', {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (res.status === 404) {
          res = await fetch('/api/records', {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          });
        }

        if (res.status === 401 || res.status === 403) {
          alert('登入憑證已過期，請重新登入！');
          localStorage.removeItem('token');
          window.location.href = '/admin-login.html';
          return;
        }

        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 30px;">試算表中尚無歷史紀錄</td></tr>';
          allRecords = [];
          displayedRecords = [];
          return;
        }

        // 將試算表資料倒序呈現（最新紀錄在上）
        allRecords = [...data].reverse();
        displayedRecords = [...allRecords];
        renderTable(displayedRecords);

      } catch (err) {
        console.error("載入歷史紀錄失敗:", err);
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--danger-color); padding: 30px;">⚠️ 讀取歷史資料失敗，請確認網路連線或 API 狀態。</td></tr>';
      }
    }

    function renderTable(list) {
      const tbody = document.getElementById('history-table');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 20px;">找不到符合關鍵字的紀錄</td></tr>';
        return;
      }

      tbody.innerHTML = list.map((r, i) => {
        const statusStr = r.status || '';
        const isOut = statusStr.includes('出倉') || statusStr.includes('提貨') || statusStr.includes('越庫');
        const statusClass = isOut ? 'status-out' : 'status-in';
        const palletInfo = r.palletStr || (Array.isArray(r.pallets) ? JSON.stringify(r.pallets) : r.pallets) || '-';

        return `
          <tr>
            <td style="color: var(--text-muted);">${i + 1}</td>
            <td><small>${r.timestamp || r.created_at || '-'}</small></td>
            <td><strong>${r.driver || '未知'}</strong></td>
            <td><code>${r.barcode || '-'}</code></td>
            <td class="${statusClass}">${statusStr || '未指定'}</td>
            <td><span class="badge">${palletInfo}</span></td>
          </tr>
        `;
      }).join('');
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) {
        displayedRecords = [...allRecords];
      } else {
        displayedRecords = allRecords.filter(r => {
          const palletInfo = r.palletStr || (Array.isArray(r.pallets) ? JSON.stringify(r.pallets) : r.pallets) || '';
          return (r.driver || '').toLowerCase().includes(q) ||
                 (r.barcode || '').toLowerCase().includes(q) ||
                 (r.status || '').toLowerCase().includes(q) ||
                 palletInfo.toLowerCase().includes(q);
        });
      }
      renderTable(displayedRecords);
    }

    // ⬇️ 匯出 CSV 邏輯 ⬇️
    function exportToCSV() {
      if (displayedRecords.length === 0) {
        alert('目前沒有資料可匯出！');
        return;
      }

      // 建立 CSV 標頭與欄位
      const headers = ['編號', '時間', '司機', '單號/條碼', '動作狀態', '棧板明細'];
      const rows = displayedRecords.map((r, index) => {
        const timeStr = r.timestamp || r.created_at || '';
        const palletInfo = r.palletStr || (Array.isArray(r.pallets) ? JSON.stringify(r.pallets) : r.pallets) || '';
        return [
          index + 1,
          `"${timeStr.replace(/"/g, '""')}"`,
          `"${(r.driver || '').replace(/"/g, '""')}"`,
          `"${(r.barcode || '').replace(/"/g, '""')}"`,
          `"${(r.status || '').replace(/"/g, '""')}"`,
          `"${palletInfo.replace(/"/g, '""')}"`
        ];
      });

      // 組合 CSV 字串
      let csvContent = headers.join(',') + '\n' + rows.map(row => row.join(',')).join('\n');

      // 加入 \uFEFF BOM 標頭，確保 Excel 開啟時 UTF-8 中文不亂碼
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      
      // 自動建立下載連結
      const today = new Date().toISOString().split('T')[0];
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', `Smile_WMS_歷史紀錄_${today}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 頁面載入後自動執行抓取
    window.addEventListener('DOMContentLoaded', fetchHistoryData);
  </script>
</body>
</html>
