<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷史作業紀錄 - Smile WMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .table-container { max-height: 75vh; overflow-y: auto; }
    .sticky-header th { position: sticky; top: 0; background-color: #212529; color: white; z-index: 10; }
  </style>
</head>
<body>
  <div class="container-fluid max-w-1200 my-3">
    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="fw-bold mb-1">📜 歷史所有作業紀錄</h2>
          <p class="text-muted mb-0">展示 Google 試算表中由司機端上傳的所有歷史資料</p>
        </div>
        <div>
          <button onclick="fetchRecords()" class="btn btn-outline-primary me-2">🔄 重新整理</button>
          <button onclick="window.close()" class="btn btn-secondary">✕ 關閉分頁</button>
        </div>
      </div>

      <hr class="my-3">

      <!-- 搜尋與篩選列 -->
      <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 搜尋司機、條碼單號或棧板名稱..." onkeyup="filterTable()">
      </div>

      <!-- 表格顯示區 -->
      <div class="table-responsive table-container">
        <table class="table table-hover align-middle mb-0">
          <thead class="sticky-header">
            <tr>
              <th style="width: 60px;">#</th>
              <th>時間</th>
              <th>司機</th>
              <th>單號 / 條碼</th>
              <th>動態狀態</th>
              <th>棧板數量與明細</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody">
            <tr><td colspan="6" class="text-center py-5 text-muted">資料載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let rawRecordsData = [];

    async function fetchRecords() {
      const tbody = document.getElementById('recordsTableBody');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">資料載入中...</td></tr>';
      
      try {
        const res = await fetch('/api/records');
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">目前尚無歷史紀錄</td></tr>';
          return;
        }

        // 將資料倒序排列（讓最新的紀錄在最上面）
        rawRecordsData = [...data].reverse();
        renderTable(rawRecordsData);

      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-danger">⚠️ 讀取歷史紀錄失敗，請檢查網路或稍後再試。</td></tr>';
      }
    }

    function renderTable(list) {
      const tbody = document.getElementById('recordsTableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">沒有符合搜尋條件的紀錄</td></tr>';
        return;
      }

      tbody.innerHTML = list.map((r, index) => {
        const isOut = (r.status || '').includes('出倉') || (r.status || '').includes('提貨') || (r.status || '').includes('越庫');
        const badgeClass = isOut ? 'bg-danger' : 'bg-success';
        
        return `
          <tr>
            <td class="text-muted fw-bold">${index + 1}</td>
            <td><small class="text-muted">${r.timestamp || '-'}</small></td>
            <td><span class="badge bg-secondary fs-6">${r.driver || '未知'}</span></td>
            <td><code>${r.barcode || '-'}</code></td>
            <td><span class="badge ${badgeClass} fs-6">${r.status || '未指定'}</span></td>
            <td class="fw-semibold">${r.palletStr || r.pallets || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderTable(rawRecordsData);
        return;
      }

      const filtered = rawRecordsData.filter(r => {
        const driver = (r.driver || '').toLowerCase();
        const barcode = (r.barcode || '').toLowerCase();
        const status = (r.status || '').toLowerCase();
        const pallets = (r.palletStr || r.pallets || '').toLowerCase();
        
        return driver.includes(query) || barcode.includes(query) || status.includes(query) || pallets.includes(query);
      });

      renderTable(filtered);
    }

    // 進入頁面時自動抓取
    fetchRecords();
  </script>
</body>
</html>
